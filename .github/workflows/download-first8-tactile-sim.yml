name: Download First 8 Tactile Simulation Papers

on:
  push:
    branches: [main]
    paths:
      - 'FIRST8_TRIGGER.txt'

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download public PDFs
        shell: bash
        run: |
          set -u
          mkdir -p first8_papers
          python - <<'PY'
          import os,time,requests,json
          headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          def try_pdf(name,urls):
              seen=set()
              for url in urls:
                  if not url or url in seen: continue
                  seen.add(url)
                  try:
                      print(f"TRY {name}: {url}",flush=True)
                      r=requests.get(url,headers=headers,timeout=90,allow_redirects=True)
                      data=r.content
                      print(" ->",r.status_code,len(data),r.headers.get("content-type",""),"final",r.url,flush=True)
                      if r.status_code==200 and len(data)>10000 and data[:4]==b"%PDF":
                          p=os.path.join("first8_papers",name); open(p,"wb").write(data); print("SAVED",p,flush=True); return True
                  except Exception as e: print("ERR",repr(e),flush=True)
                  time.sleep(1)
              return False

          old="http://homes.cs.washington.edu/~todorov/papers/TodorovIROS12.pdf"
          mujoco_urls=[]
          try:
              cdx="https://web.archive.org/cdx/search/cdx?url=homes.cs.washington.edu/~todorov/papers/TodorovIROS12.pdf&output=json&filter=statuscode:200&fl=timestamp,original,mimetype&filter=mimetype:application/pdf&collapse=digest&limit=20"
              rr=requests.get(cdx,headers=headers,timeout=30)
              print("CDX",rr.status_code,rr.text[:4000],flush=True)
              rows=rr.json()
              for row in rows[1:]:
                  ts,orig,*rest=row
                  mujoco_urls.append(f"https://web.archive.org/web/{ts}id_/{orig}")
          except Exception as e: print("CDX ERR",repr(e),flush=True)
          mujoco_urls += [
            "https://www.researchgate.net/publication/profile/Yuval-Tassa/publication/261353949_MuJoCo_A_physics_engine_for_model-based_control/links/5639f48d08aeed0531dc77f7/MuJoCo-A-physics-engine-for-model-based-control.pdf",
            "https://homes.cs.washington.edu/~todorov/papers/TodorovIROS12.pdf",
            "https://xplorestaging.ieee.org/ielx5/6363628/6385431/06386109.pdf?arnumber=6386109"
          ]
          results=[]
          results.append(("01_MuJoCo_Todorov_Erez_Tassa_2012.pdf",try_pdf("01_MuJoCo_Todorov_Erez_Tassa_2012.pdf",mujoco_urls)))
          papers=[
            ("02_Contact_Models_in_Robotics_Le_Lidec_et_al_2024.pdf",["https://arxiv.org/pdf/2304.06372.pdf"]),
            ("03_TACTO_Wang_et_al_2022.pdf",["https://arxiv.org/pdf/2012.08456.pdf"]),
            ("04_Taxim_Si_Yuan_2022.pdf",["https://arxiv.org/pdf/2109.04027.pdf"]),
            ("05_TacIPC_Du_et_al_2024.pdf",["https://arxiv.org/pdf/2311.05843.pdf"]),
            ("06_DIFFTACTile_Si_et_al_ICLR_2024.pdf",["https://proceedings.iclr.cc/paper_files/paper/2024/file/1cc70be9fb6a83bc46cf4ac21a91e0b0-Paper-Conference.pdf","https://arxiv.org/pdf/2403.08716.pdf"]),
            ("07_TacEx_Nguyen_et_al_2024.pdf",["https://arxiv.org/pdf/2411.04776.pdf"]),
            ("08_Taccel_Li_et_al_NeurIPS_2025.pdf",["https://taccel-simulator.github.io/assets/taccel-paper.pdf","https://arxiv.org/pdf/2504.12908.pdf"]),
          ]
          for n,u in papers: results.append((n,try_pdf(n,u)))
          with open("first8_papers/download_status.txt","w") as f:
              for n,ok in results: f.write(f"{'OK' if ok else 'MISSING'}\t{n}\n")
          print("MISSING:",[n for n,ok in results if not ok],flush=True)
          PY
          cat > first8_papers/00_README.txt <<'EOF'
          First-round tactile / contact simulation reading set
          01 MuJoCo — basic robot physics simulator
          02 Contact Models in Robotics — contact/friction/solver foundations
          03 TACTO — optical tactile rendering
          04 Taxim — GelSight optical + marker simulation
          05 TacIPC — FEM + IPC elastomer/contact simulation
          06 DiffTactile — differentiable physics-based tactile simulation
          07 TacEx — Isaac Sim + soft body + visuotactile integration
          08 Taccel — scalable high-fidelity GPU tactile simulation
          EOF
          ls -lh first8_papers
      - name: Upload paper bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tactile-simulation-first8
          path: first8_papers/
          compression-level: 0
          retention-days: 7
